name: Pre-Commit Dashboard Update (Every 3 Hours)

on:
  schedule:
    # 每3小时整点执行（UTC 0,3,6,9,12,15,18,21）
    - cron: '0 */3 * * *'

  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch pre-commit data
        run: |
          echo "获取最新开启中PR的pre-commit检查数据..."
          python scripts/fetch_history.py -n 10
        env:
          TZ: 'Asia/Shanghai'
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Generate dashboard HTML
        run: |
          echo "生成看板..."
          python scripts/generate_history.py

      - name: Copy assets to docs folder
        run: |
          mkdir -p docs
          cp output/*.html docs/
          cp output/*.json docs/
          python scripts/generate_index_md.py docs/index.md docs/update_info.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: 更新 pre-commit 看板数据 [auto]'
          force_orphan: false
